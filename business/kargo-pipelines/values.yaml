# Pipelines Kargo : un Project par dépôt GitHub, une Stage par environnement.
# Déployé par l'Application kargo-pipelines (business/templates/kargo-pipelines.yaml).
#
# Une promotion écrit le tag de chaque composant dans helm.yaml du dépôt
# (applications.<index>.tag.<env>), pousse sur main, puis synchronise
# l'Application ArgoCD <env>-<dépôt>.
#
# envs, projects, github, branch et registry ne se saisissent PAS ici : ils
# viennent de business/values.yaml (helm.valuesObject de l'Application) ; access
# de la matrice d'accès de platform-gitops.

envs: []
projects: []
github: ""
branch: main
registry: ""

# SSO : droits dans chaque Project depuis la matrice d'accès
# platform-gitops/values/common/access.yaml (tools.kargo.roles.<rôle>.project /
# projectRules), passée en valueFile par l'Application (templates/kargo-pipelines.yaml).
access: {}

# Images retenues : tags = sha court du commit (7 caractères, écrit par la CI).
warehouse:
  interval: 5m
  allowTagsRegexes:
    - ^[0-9a-f]{7}$
  discoveryLimit: 10
