# Un AppProject ArgoCD par dépôt GitHub projet.
# Chaque projet ne peut :
#   - lire que le dépôt gitops (chart) et son propre dépôt (helm.yaml)
#   - déployer que dans ses namespaces <env>-<projet>, sur n'importe quel cluster déclaré
#   - créer que les ressources du chart (+ son namespace, via CreateNamespace)
# Nouveau projet = un bloc ici + une ligne dans applicationset.yaml (+ kargo-pipelines/values.yaml).
# Synchronisé par l'Application business-root (platform-gitops) : un commit suffit.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: formation-ba-assurance-iard
  namespace: argocd
spec:
  description: https://github.com/mchekini-check-consulting/formation-ba-assurance-iard
  sourceRepos:
    - https://github.com/mchekini-check-consulting/formation-ba-gitops.git
    - https://github.com/mchekini-check-consulting/formation-ba-assurance-iard.git
  destinations:
    - name: "*"
      namespace: "*-formation-ba-assurance-iard"
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }   # CreateNamespace=true
  namespaceResourceWhitelist:
    - { group: apps, kind: Deployment }
    - { group: "", kind: Service }
    - { group: networking.k8s.io, kind: Ingress }
    - { group: traefik.io, kind: Middleware }
    - { group: cert-manager.io, kind: Certificate }   # TLS *.<projet>.<env>.<domaine>
---
