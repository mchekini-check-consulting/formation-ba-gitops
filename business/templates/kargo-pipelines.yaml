{{- /* Pipelines Kargo des projets (chart business/kargo-pipelines/), avec les
       envs et projects de values.yaml. Prérequis : Kargo installé (tools.kargo, wave 40).
       Application séparée de business-root :
         - AppProject dédié : uniquement des ressources Kargo et les namespaces des Projects
         - prune: true      : retirer un env ou un projet supprime ses Stages/Warehouse
                              (business-root, lui, ne supprime jamais rien)
         - une erreur Kargo ne bloque pas la synchronisation de business-root */}}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kargo-pipelines
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Pipelines Kargo (Project, Warehouse, Stages) des dépôts formation-ba-*
  sourceRepos:
    - {{ .Values.gitops.repoURL }}
  # namespace "*" : l'Application n'a pas de namespace par défaut (chaque ressource
  # Kargo porte le sien). Le périmètre est limité par les whitelists ci-dessous
  # (ressources Kargo et namespaces uniquement) et par sourceRepos.
  destinations:
    - name: in-cluster
      namespace: "*"
  clusterResourceWhitelist:
    - { group: "", kind: Namespace }                  # namespace du Project (adopté par Kargo)
    - { group: kargo.akuity.io, kind: Project }
  namespaceResourceWhitelist:
    - { group: kargo.akuity.io, kind: ProjectConfig }
    - { group: kargo.akuity.io, kind: Warehouse }
    - { group: kargo.akuity.io, kind: Stage }
    # SSO : ServiceAccount annoté (claims) + RoleBinding vers le Role kargo-promoter
    - { group: "", kind: ServiceAccount }
    - { group: rbac.authorization.k8s.io, kind: RoleBinding }
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo-pipelines
  namespace: argocd
spec:
  project: kargo-pipelines
  source:
    repoURL: {{ .Values.gitops.repoURL }}
    targetRevision: {{ .Values.gitops.targetRevision }}
    path: business/kargo-pipelines
    helm:
      valuesObject:
        {{- toYaml (pick .Values "github" "branch" "registry" "envs" "projects") | nindent 8 }}
  destination:
    name: in-cluster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
