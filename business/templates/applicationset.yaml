{{- /* Une Application par (environnement x projet), dans l'AppProject du projet :
         - chart  : gitops-ba-formation/ du dépôt gitops
         - values : helm.yaml à la racine du dépôt du projet
       Les listes viennent de values.yaml (envs, projects).
       Les {{`{{ ... }}`}} sont échappés : ils sont évalués par l'ApplicationSet, pas par Helm. */}}
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: formation-ba
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                {{- range .Values.envs }}
                - env: {{ .name }}
                  cluster: {{ .cluster }}
                {{- end }}
          - list:
              elements:
                {{- range .Values.projects }}
                - project: {{ .name }}
                {{- end }}
  # Retirer un projet ou un environnement supprime l'Application, mais pas les
  # Deployments, Services... déjà déployés (suppression = geste manuel)
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{`{{ .env }}-{{ .project }}`}}'
      annotations:
        # La Stage Kargo <env> du Project <projet> peut synchroniser cette Application
        kargo.akuity.io/authorized-stage: '{{`{{ .project }}:{{ .env }}`}}'
    spec:
      project: '{{`{{ .project }}`}}'
      sources:
        - repoURL: {{ .Values.gitops.repoURL }}
          targetRevision: {{ .Values.gitops.targetRevision }}
          path: gitops-ba-formation
          helm:
            releaseName: '{{`{{ .project }}`}}'
            valueFiles:
              - $app/helm.yaml
            parameters:
              - name: env
                value: '{{`{{ .env }}`}}'
              - name: project
                value: '{{`{{ .project }}`}}'
        - repoURL: '{{ .Values.github }}/{{`{{ .project }}`}}.git'
          targetRevision: {{ .Values.branch }}
          ref: app
      destination:
        name: '{{`{{ .cluster }}`}}'
        namespace: '{{`{{ .env }}-{{ .project }}`}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
