# Configuration Keycloak as code (chart maison chart-base/keycloak-config) :
# realms, un client par outil avec ses rôles, groupes = composition de rôles.
# Utilisateurs (et leurs groupes) : values/<env>/keycloak-config.yaml.
# Appliqué par keycloak-config-cli à chaque modification (Job nommé par hash).
#
# Ajouter un outil = un bloc dans realms.platform.clients + ses rôles dans les groupes.
# Retirer un client, un rôle ou un groupe d'ici le supprime de Keycloak.
realms:
  # Realm unique des outils de la plateforme : une session = SSO sur tous les outils
  platform:
    displayName: Plateforme formation-ba
    clients:
      # Kargo : client public (PKCE). Rôles lus dans le claim "roles" (values/*/kargo.yaml,
      # business/kargo-pipelines). /login : interface web ; localhost (port aléatoire) :
      # CLI kargo login --sso
      kargo:
        name: Kargo
        host: kargo
        public: true
        redirectPaths: [/login]
        extraRedirectUris:
          - http://localhost:*
        roles: [admin, promoter, viewer]
      # ArgoCD : client public (PKCE, enablePKCEAuthentication), pas de secret à partager.
      # /pkce/verify et /auth/callback : interface web ; localhost:8085 : CLI argocd login --sso
      argocd:
        name: Argo CD
        host: argocd
        public: true
        redirectPaths: [/auth/callback, /pkce/verify]
        extraRedirectUris:
          - http://localhost:8085/auth/callback
        roles: [admin, readonly]
      # SonarQube Community : SAML (values/*/sonarqube.yaml). clientId = "Application ID"
      # côté SonarQube. Assertion : login, name, email, groups. Rôle admin -> groupe
      # SonarQube sonar-administrators (groupes inconnus de SonarQube ignorés ; tout
      # utilisateur connecté est dans sonar-users).
      sonarqube:
        name: SonarQube
        protocol: saml
        host: sonarqube
        redirectPaths: [/oauth2/callback/saml]
        roles: [admin, user]
        # Certificat de signature du realm, lu par SonarQube (SONAR_AUTH_SAML_CERTIFICATE_SECURED)
        idpCertificateSecret:
          namespace: sonarqube
          name: sonarqube-saml-idp
        attributes:
          saml.client.signature: "false"       # SonarQube ne signe pas ses requêtes
          saml_name_id_format: username
          saml.force.name.id.format: "true"
        settings:
          # Sans le scope role_list (attribut "Role" répété : refusé par SonarQube) ;
          # rôles envoyés par le mapper groups ci-dessous
          defaultClientScopes: []
        protocolMappers:
          - name: login
            protocol: saml
            protocolMapper: saml-user-property-mapper
            config:
              user.attribute: username
              attribute.name: login
              attribute.nameformat: Basic
          # Nom affiché : prénom (SAML n'a pas de mapper "nom complet")
          - name: name
            protocol: saml
            protocolMapper: saml-user-property-mapper
            config:
              user.attribute: firstName
              attribute.name: name
              attribute.nameformat: Basic
          - name: email
            protocol: saml
            protocolMapper: saml-user-property-mapper
            config:
              user.attribute: email
              attribute.name: email
              attribute.nameformat: Basic
          # Rôles de l'utilisateur dans un seul attribut multi-valeurs "groups"
          - name: groups
            protocol: saml
            protocolMapper: saml-role-list-mapper
            config:
              attribute.name: groups
              attribute.nameformat: Basic
              single: "true"
          # Renomme le rôle client sonarqube.admin en groupe SonarQube
          - name: admin-to-sonar-administrators
            protocol: saml
            protocolMapper: saml-role-name-mapper
            config:
              role: sonarqube.admin
              new.role.name: sonar-administrators

    # Groupes : on attache les utilisateurs aux groupes, jamais directement aux rôles
    groups:
      platform-admins:
        clientRoles:
          kargo: [admin]
          argocd: [admin]
          sonarqube: [admin]
      ba:
        clientRoles:
          kargo: [promoter]
          argocd: [readonly]
          sonarqube: [user]
      dev-team:
        clientRoles:
          kargo: [viewer]
          argocd: [readonly]
          sonarqube: [user]

  # Realm applicatif : accueillera les clients des projets métier (formation-ba-*).
  # Vide pour l'instant (réglages par défaut uniquement).
  formation-ba:
    displayName: Applications formation-ba
