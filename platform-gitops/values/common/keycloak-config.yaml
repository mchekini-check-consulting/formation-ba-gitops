# Configuration Keycloak as code (chart maison chart-base/keycloak-config) :
# realms et un client par outil (partie technique : URL, protocole, mappers).
# Rôles des clients, groupes et MFA du realm platform : matrice d'accès
# values/common/access.yaml (valueFile commun, access: true dans platform-apps).
# Utilisateurs (et leurs groupes) : values/<env>/keycloak-config.yaml.
# Appliqué par keycloak-config-cli à chaque modification (Job nommé par hash).
#
# Ajouter un outil = un bloc dans realms.platform.clients + ses rôles et groupes dans
# access.yaml. Retirer un client, un rôle ou un groupe le supprime de Keycloak.
realms:
  # Realm unique des outils de la plateforme : une session = SSO sur tous les outils
  platform:
    displayName: Plateforme formation-ba
    # Clé RS256 fixée (Certificate cert-manager, Secret keycloak-realm-platform-signing) :
    # connue d'avance par SonarQube (SAML), stable si le realm est recréé. OIDC (Kargo,
    # ArgoCD) : relue automatiquement via JWKS.
    signingKey: true
    clients:
      # Kargo : client public (PKCE). Rôles dans le claim "roles". /login : interface
      # web ; localhost (port aléatoire) : CLI kargo login --sso
      kargo:
        name: Kargo
        host: kargo
        public: true
        redirectPaths: [/login]
        extraRedirectUris:
          - http://localhost:*
      # ArgoCD : client public (PKCE, enablePKCEAuthentication), pas de secret à partager.
      # /pkce/verify et /auth/callback : interface web ; localhost:8085 : CLI argocd login --sso
      argocd:
        name: Argo CD
        host: argocd
        public: true
        redirectPaths: [/auth/callback, /pkce/verify]
        extraRedirectUris:
          - http://localhost:8085/auth/callback
      # SonarQube Community : SAML (values/*/sonarqube.yaml). clientId = "Application ID"
      # côté SonarQube. Assertion : login, name, email, groups (rôles renommés en groupes
      # SonarQube : access.tools.sonarqube.roles.<rôle>.group).
      sonarqube:
        name: SonarQube
        protocol: saml
        host: sonarqube
        redirectPaths: [/oauth2/callback/saml]
        samlGroupsAttribute: groups
        # Certificat de la clé fixée, lu par SonarQube (SONAR_AUTH_SAML_CERTIFICATE_SECURED)
        idpCertificateSecret:
          namespace: sonarqube
          name: sonarqube-saml-idp
        attributes:
          saml.client.signature: "false"       # SonarQube ne signe pas ses requêtes
          saml_name_id_format: username
          saml.force.name.id.format: "true"
        settings:
          # Sans le scope role_list (attribut "Role" répété : refusé par SonarQube) ;
          # rôles envoyés dans l'attribut groups (samlGroupsAttribute)
          defaultClientScopes: []
        protocolMappers:
          - name: login
            protocol: saml
            protocolMapper: saml-user-property-mapper
            config:
              user.attribute: username
              attribute.name: login
              attribute.nameformat: Basic
          # Nom affiché : prénom (SAML n'a pas de mapper "nom complet")
          - name: name
            protocol: saml
            protocolMapper: saml-user-property-mapper
            config:
              user.attribute: firstName
              attribute.name: name
              attribute.nameformat: Basic
          - name: email
            protocol: saml
            protocolMapper: saml-user-property-mapper
            config:
              user.attribute: email
              attribute.name: email
              attribute.nameformat: Basic

  # Realm applicatif : accueillera les clients des projets métier (formation-ba-*).
  # Vide pour l'instant (réglages par défaut uniquement).
  formation-ba:
    displayName: Applications formation-ba
