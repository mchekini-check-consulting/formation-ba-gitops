# Values du chart argo-cd : bootstrap.sh (1re install) ET Application argocd.
crds:
  install: false   # CRDs fournies par crd-base/argocd/<version>

configs:
  params:
    # TLS terminé par Traefik
    server.insecure: true
  cm:
    # Sans ce health check, une Application est toujours "Healthy" pour l'app
    # racine : les sync-waves (crds -10 -> outils 0) n'attendraient rien.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
