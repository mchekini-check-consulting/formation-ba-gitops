# Values du chart argo-cd : bootstrap.sh (1re install) ET Application argocd.
crds:
  install: false   # CRDs fournies par crd-base/argocd/<version>

configs:
  params:
    # TLS terminé par Traefik
    server.insecure: true
  # Droits des utilisateurs SSO (Keycloak, realm platform, client argocd) : rôles du
  # client reçus dans le claim "roles" (groupes Keycloak : values/common/keycloak-config.yaml).
  # Sans rôle : aucun accès. Le compte admin local reste actif (secours du SSO).
  rbac:
    scopes: "[roles]"
    policy.default: ""
    policy.csv: |
      g, admin, role:admin
      g, readonly, role:readonly
  cm:
    # Sans ce health check, une Application est toujours "Healthy" pour l'app
    # racine : les sync-waves (crds -10 -> outils 0) n'attendraient rien.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
