# Ingress servi par Traefik ; external-dns crée l'ALIAS sonarqube.dev.check-consulting.net -> NLB.
# HTTPS : wildcard *.dev.check-consulting.net, certificat par défaut de Traefik (cert-manager).
# URL à mettre dans le secret SONAR_HOST_URL de la CI.
ingress:
  enabled: true
  ingressClassName: traefik
  hosts:
    - name: sonarqube.dev.check-consulting.net
      path: /
      pathType: Prefix

# SAML : URL publique (callback https://sonarqube.dev.check-consulting.net/oauth2/callback/saml)
# et realm platform de Keycloak
sonarProperties:
  sonar.core.serverBaseURL: https://sonarqube.dev.check-consulting.net
  sonar.auth.saml.providerId: https://keycloak.dev.check-consulting.net/realms/platform
  sonar.auth.saml.loginUrl: https://keycloak.dev.check-consulting.net/realms/platform/protocol/saml
