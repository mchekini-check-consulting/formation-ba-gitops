{{- /* Crée les Secrets absents avant l'import (hooks ArgoCD PreSync) : mot de passe
       initial des utilisateurs, secret du client de keycloak-config-cli, secret de
       chaque client OIDC confidentiel.
       Rien dans Git, aucune étape manuelle ; un Secret existant n'est jamais modifié.
       RBAC limité au namespace, supprimé avec le Job une fois réussi. */}}
{{- $name := printf "%s-secrets" (include "kc.fullname" .) }}
{{- $secrets := list (dict "name" .Values.users.initialPasswordSecret.name "key" .Values.users.initialPasswordSecret.key) }}
{{- $secrets = append $secrets (dict "name" .Values.keycloak.client.secret.name "key" .Values.keycloak.client.secret.key) }}
{{- range include "kc.confidentialClients" . | fromYamlArray }}
{{- $secrets = append $secrets (dict "name" .secret "key" "client-secret") }}
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "kc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "kc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  # Lire uniquement ces Secrets ; create ne peut pas être restreint par nom
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
      {{- range $secrets }}
      - {{ .name }}
      {{- end }}
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "kc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "kc.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        {{- include "kc.labels" . | nindent 8 }}
        app.kubernetes.io/component: secrets
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
      containers:
        - name: generate
          image: {{ .Values.secretGenerator.image | quote }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # "secret:clé" séparés par des espaces
            - name: SECRETS
              value: {{ range $i, $s := $secrets }}{{ if $i }} {{ end }}{{ $s.name }}:{{ $s.key }}{{ end }}
            - name: HOME
              value: /tmp            # cache kubectl
          command:
            - sh
            - -ec
            - |
              for entry in $SECRETS; do
                SECRET="${entry%%:*}"; KEY="${entry#*:}"
                if kubectl -n "$NAMESPACE" get secret "$SECRET" >/dev/null 2>&1; then
                  echo "Secret $SECRET présent : conservé"
                  continue
                fi
                # 21 caractères aléatoires + Aa1 : majuscule, minuscule et chiffre
                # garantis (politique de mot de passe des realms)
                VALUE="$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 21)Aa1"
                kubectl -n "$NAMESPACE" create secret generic "$SECRET" --from-literal="$KEY=$VALUE"
                echo "Secret $SECRET créé"
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
