{{- /* Realms générés depuis les values (un fichier JSON par realm), lus par le Job d'import.
       Les secrets n'y figurent pas : $(env:...) remplacés à l'import depuis des Secrets. */}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kc.fullname" . }}-realms
  labels:
    {{- include "kc.labels" . | nindent 4 }}
data:
  {{- include "kc.realmFiles" . | nindent 2 }}
