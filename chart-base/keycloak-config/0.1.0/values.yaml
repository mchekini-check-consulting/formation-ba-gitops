# keycloak-config-cli : applique les realms générés depuis realms (ci-dessous).
# Tag = <version cli>-<version Keycloak> : toujours celui de la version Keycloak
# déployée (chart keycloakx), à monter ensemble.
image:
  repository: adorsys/keycloak-config-cli   # multi-arch (amd64, arm64)
  tag: "6.5.1-26.5.5"
  pullPolicy: IfNotPresent

# Connexion à Keycloak : compte admin du realm master
keycloak:
  url: http://keycloak-http                 # Service du chart keycloakx (même namespace)
  user: admin
  passwordSecret:
    name: keycloak-admin
    key: password
  availabilityTimeout: 300s                 # attente de Keycloak (démarrage, mise à jour)

# Domaine des outils : URL d'un client = https://<client.host>.<baseDomain>
baseDomain: ""                              # ex. dev.check-consulting.net

# Mot de passe initial commun des utilisateurs créés : temporaire (changement
# imposé à la première connexion), posé uniquement à la création (jamais réappliqué).
# Lecture : kubectl -n keycloak get secret keycloak-users-initial-password -o jsonpath='{.data.password}' | base64 -d
users:
  initialPasswordSecret:
    name: keycloak-users-initial-password
    key: password

# Job PreSync qui crée les Secrets absents (mot de passe initial, secrets des
# clients confidentiels) ; un Secret existant n'est jamais modifié.
secretGenerator:
  image: alpine/k8s:1.31.13                 # kubectl + sh, multi-arch (amd64, arm64)

# Réglages appliqués à chaque realm (surchargeables par realms.<realm>.settings).
# Pas de SMTP : pas de mot de passe oublié, comptes réinitialisés par un admin.
realmDefaults:
  sslRequired: external
  loginWithEmailAllowed: true
  duplicateEmailsAllowed: false
  resetPasswordAllowed: false
  registrationAllowed: false
  bruteForceProtected: true
  passwordPolicy: "length(12) and upperCase(1) and lowerCase(1) and digits(1) and notUsername(undefined)"

# Realms, par nom :
#   <realm>:
#     displayName: ...
#     settings: {}                 # attributs de RealmRepresentation en plus / à la place de realmDefaults
#     clients:                     # un client par outil
#       <clientId>:
#         name: ...                # libellé (défaut : clientId)
#         protocol: openid-connect # ou saml
#         host: kargo              # -> rootUrl https://kargo.<baseDomain>
#         redirectPaths: [/login]  # -> https://<host>.<baseDomain>/login
#         extraRedirectUris: []    # URI complètes (ex. CLI : http://localhost/auth/callback)
#         public: false            # OIDC : true = PKCE sans secret ; false = secret dans le
#                                  # Secret keycloak-client-<realm>-<clientId> (clé client-secret)
#         rolesClaim: roles        # OIDC : claim du jeton qui porte les rôles de CE client
#         roles: [admin, viewer]   # rôles du client
#         attributes: {}           # attributs Keycloak du client (ex. SAML)
#         protocolMappers: []      # mappers en plus (ex. SAML : login, email, rôles)
#     groups:                      # groupe = composition de rôles de plusieurs clients
#       <groupe>:
#         clientRoles: {kargo: [admin], argocd: [admin]}
#     users:                       # jamais supprimés par keycloak-config-cli : enabled: false pour désactiver
#       <username>:
#         email: ...
#         firstName: ...
#         lastName: ...
#         enabled: true
#         groups: [<groupe>]
realms: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
