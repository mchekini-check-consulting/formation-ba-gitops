{{- /* Copie le secret d'un client OIDC confidentiel (Secret keycloak-client-<realm>-<client>,
       créé par secret-generator.yaml) dans un Secret du namespace de l'outil, clé
       client-secret (ex. Grafana : auth.generic_oauth.client_secret). Aucun appel à Keycloak.
       Hook PostSync : après l'import ; Secret créé ou mis à jour (même valeur que celle
       déclarée dans Keycloak). Le namespace cible doit exister (outil déjà déployé
       ou namespace créé par une wave antérieure).
       RBAC : lecture des Secrets sources ; un Role par Secret cible, limité à ce Secret
       (create : non restreignable). */}}
{{- $targets := include "kc.clientSecretCopies" . | fromYamlArray }}
{{- if $targets }}
{{- $name := printf "%s-client-secrets" (include "kc.fullname" .) }}
{{- $sources := list }}
{{- range $targets }}{{ $sources = append $sources .source }}{{ end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "kc.labels" . | nindent 4 }}
  annotations:
    {{- include "kc.hook" (dict "phase" "PostSync" "wave" "-1") | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-source
  labels:
    {{- include "kc.labels" . | nindent 4 }}
  annotations:
    {{- include "kc.hook" (dict "phase" "PostSync" "wave" "-1") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: {{ $sources | uniq | toJson }}
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-source
  labels:
    {{- include "kc.labels" . | nindent 4 }}
  annotations:
    {{- include "kc.hook" (dict "phase" "PostSync" "wave" "-1") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-source
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- range $t := $targets }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-{{ $t.name }}
  namespace: {{ $t.namespace }}
  labels:
    {{- include "kc.labels" $ | nindent 4 }}
  annotations:
    {{- include "kc.hook" (dict "phase" "PostSync" "wave" "-1") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $t.name }}]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-{{ $t.name }}
  namespace: {{ $t.namespace }}
  labels:
    {{- include "kc.labels" $ | nindent 4 }}
  annotations:
    {{- include "kc.hook" (dict "phase" "PostSync" "wave" "-1") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-{{ $t.name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "kc.labels" . | nindent 4 }}
  annotations:
    {{- include "kc.hook" (dict "phase" "PostSync" "wave" "0") | nindent 4 }}
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "kc.labels" . | nindent 8 }}
        app.kubernetes.io/component: client-secrets
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
      containers:
        - name: copy
          image: {{ .Values.secretGenerator.image | quote }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # "source:namespace:secret" séparés par des espaces
            - name: TARGETS
              value: {{ range $i, $t := $targets }}{{ if $i }} {{ end }}{{ $t.source }}:{{ $t.namespace }}:{{ $t.name }}{{ end }}
            - name: HOME
              value: /tmp            # cache kubectl
          command:
            - sh
            - -ec
            - |
              for entry in $TARGETS; do
                SOURCE="${entry%%:*}"; rest="${entry#*:}"; NS="${rest%%:*}"; SECRET="${rest#*:}"
                VALUE="$(kubectl -n "$NAMESPACE" get secret "$SOURCE" -o jsonpath='{.data.client-secret}' | base64 -d)"
                [ -n "$VALUE" ] || { echo "ERREUR : $SOURCE sans client-secret"; exit 1; }
                kubectl -n "$NS" create secret generic "$SECRET" --from-literal=client-secret="$VALUE" \
                  --dry-run=client -o yaml | kubectl apply -f -
                echo "Secret $SOURCE copié dans $NS/$SECRET"
              done
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
{{- end }}
