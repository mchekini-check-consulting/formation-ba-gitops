# D'où viennent les charts Helm de chaque outil (lu par scripts/sync-charts.sh).
tools:
  argocd:
    repo: https://argoproj.github.io/argo-helm
    chart: argo-cd

  traefik:
    repo: https://traefik.github.io/charts
    chart: traefik

  external-dns:
    repo: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns

  # Opérateur PostgreSQL : bases des outils de la plateforme et des applications dev
  cloudnative-pg:
    repo: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg

  # Bases PostgreSQL : charts maison, écrits directement dans chart-base
  # (déclaration des bases : gitops/values/<common|env>/databases.yaml) :
  #   pg-lib     : chart library (Cluster, bases logiques, sauvegardes S3), partagé
  #   pg-cluster : base d'un outil de la plateforme (tools.<outil>.chart: pg-cluster)

  # Sauvegardes des bases CNPG vers S3 (plugin CNPG-I Barman Cloud : ObjectStore,
  # archivage WAL, sauvegardes physiques), dans le namespace de l'opérateur
  plugin-barman-cloud:
    repo: https://cloudnative-pg.github.io/charts
    chart: plugin-barman-cloud

  sonarqube:
    repo: https://SonarSource.github.io/helm-chart-sonarqube
    chart: sonarqube

  # cloudbeaver : chart maison écrit directement dans chart-base/cloudbeaver/<version>
  # (pas de chart Helm publié pour CloudBeaver CE) ; nouvelle version = nouveau dossier.

  # Certificats TLS (Let's Encrypt, DNS-01 Route53)
  cert-manager:
    repo: https://charts.jetstack.io
    chart: cert-manager

  # Détection d'anomalies runtime (syscalls), sortie en stdout -> récupérée par Fluent Bit
  falco:
    repo: https://falcosecurity.github.io/charts
    chart: falco

  # Keycloak (SSO des outils de la plateforme), image officielle quay.io/keycloak.
  # Realms, clients, groupes, utilisateurs : chart maison chart-base/keycloak-config.
  keycloakx:
    repo: https://codecentric.github.io/helm-charts
    chart: keycloakx

  # keycloak-config : chart maison écrit directement dans chart-base/keycloak-config/<version>
  # (realms générés depuis les values, appliqués par keycloak-config-cli).

  # sonarqube-config : chart maison écrit directement dans chart-base/sonarqube-config/<version>
  # (groupes SonarQube et leurs permissions depuis la matrice d'accès, API SonarQube).

  # Charts maison des projets métier (versions : business.charts de gitops/values.yaml) :
  #   charts-ba-formations : chart applicatif des dépôts formation-ba-* (helm.yaml)
  #   kargo-pipelines      : Project, Warehouse, Stages Kargo de chaque dépôt

  # Promotion des images dev -> qualif -> preprod -> prod (pilote ArgoCD).
  # Chart publié uniquement en OCI (sync-charts.sh gère oci://)
  kargo:
    repo: oci://ghcr.io/akuity/kargo-charts
    chart: kargo
