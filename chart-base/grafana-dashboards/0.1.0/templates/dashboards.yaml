{{- /* Un ConfigMap par dashboard activé (dashboards.<nom>.enabled), contenu
       dashboards/<nom>.json du chart, lu par le sidecar de Grafana (label
       sidecarLabel, même namespace) et rangé dans le dossier annotation grafana_folder.
       Fichiers JSON lus sans tpl : la syntaxe {{ }} de Loki et de Grafana y reste
       telle quelle ; seuls les marqueurs __EKS_LOG_GROUP_NAME__ / __EKS_LOG_GROUP_ARN__
       sont remplacés (dashboard infra, eksLogGroup). */}}
{{- range $name, $d := .Values.dashboards }}
{{- if $d.enabled }}
{{- $file := printf "dashboards/%s.json" $name }}
{{- $json := $.Files.Get $file }}
{{- if not $json }}
{{- fail (printf "dashboards.%s : fichier %s absent du chart" $name $file) }}
{{- end }}
{{- if contains "__EKS_LOG_GROUP_" $json }}
{{- $json = $json | replace "__EKS_LOG_GROUP_NAME__" (required (printf "dashboards.%s : eksLogGroup.name requis" $name) $.Values.eksLogGroup.name) }}
{{- $json = $json | replace "__EKS_LOG_GROUP_ARN__" (required (printf "dashboards.%s : eksLogGroup.arn requis" $name) $.Values.eksLogGroup.arn) }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-{{ $name }}
  labels:
    {{ $.Values.sidecarLabel.name }}: {{ $.Values.sidecarLabel.value | quote }}
    app.kubernetes.io/name: grafana-dashboards
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
  annotations:
    grafana_folder: {{ $d.folder | default $.Values.folder | quote }}
data:
  {{ $name }}.json: |-
    {{- $json | nindent 4 }}
{{- end }}
{{- end }}
