{{- /* Génère le Secret du mot de passe admin s'il n'existe pas (comme CloudNativePG pour
       ses bases) : rien dans Git, aucune étape manuelle. Hooks ArgoCD PreSync : le
       namespace existe déjà (CreateNamespace) et le Secret avant le Deployment.
       RBAC limité au namespace, supprimé avec le Job une fois réussi.
       Lecture : kubectl -n <ns> get secret <nom> -o jsonpath='{.data.password}' | base64 -d */}}
{{- if .Values.server.admin.generatePassword.enabled }}
{{- $name := printf "%s-admin-secret" (include "cloudbeaver.fullname" .) }}
{{- $secret := required "server.admin.passwordSecret.name requis" .Values.server.admin.passwordSecret.name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "cloudbeaver.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "cloudbeaver.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  # Lire uniquement ce Secret ; create ne peut pas être restreint par nom
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $secret }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "cloudbeaver.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "cloudbeaver.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  template:
    metadata:
      # Pas les selectorLabels de CloudBeaver : le Service et le Deployment
      # sélectionneraient aussi ce pod (un sélecteur ignore les labels en plus)
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: admin-secret
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
      containers:
        - name: generate
          image: {{ .Values.server.admin.generatePassword.image | quote }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SECRET
              value: {{ $secret | quote }}
            - name: KEY
              value: {{ .Values.server.admin.passwordSecret.key | quote }}
            - name: HOME
              value: /tmp            # cache kubectl
          command:
            - sh
            - -ec
            - |
              if kubectl -n "$NAMESPACE" get secret "$SECRET" >/dev/null 2>&1; then
                echo "Secret $SECRET présent : conservé"
                exit 0
              fi
              # 21 caractères aléatoires + Aa1 : majuscule, minuscule et chiffre
              # garantis (politique de mot de passe CloudBeaver)
              PASS="$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 21)Aa1"
              kubectl -n "$NAMESPACE" create secret generic "$SECRET" --from-literal="$KEY=$PASS"
              echo "Secret $SECRET créé"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
{{- end }}
