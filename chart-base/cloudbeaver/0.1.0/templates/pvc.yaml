apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cloudbeaver.fullname" . }}-workspace
  labels:
    {{- include "cloudbeaver.labels" . | nindent 4 }}
  {{- if .Values.persistence.keep }}
  annotations:
    helm.sh/resource-policy: keep                         # helm uninstall
    argocd.argoproj.io/sync-options: Prune=false,Delete=false   # ArgoCD (ignore l'annotation Helm)
  {{- end }}
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
