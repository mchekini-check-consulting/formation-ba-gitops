{{- /* Génère le Secret du cookie de session d'oauth2-proxy s'il n'existe pas (même
       principe que cloudbeaver/admin-secret-generator.yaml) : rien dans Git, aucune
       étape manuelle. Hooks ArgoCD PreSync : le Secret existe avant le Deployment.
       RBAC limité au namespace, supprimé avec le Job une fois réussi. */}}
{{- if and .Values.oauth2Proxy.enabled .Values.oauth2Proxy.cookieSecret.generate.enabled }}
{{- $c := .Values.oauth2Proxy.cookieSecret }}
{{- $name := "mailpit-oauth2-cookie-generator" }}
{{- $ctx := dict "root" $ "component" $name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailpit.labels" $ctx | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailpit.labels" $ctx | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
rules:
  # Lire uniquement ce Secret ; create ne peut pas être restreint par nom
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ $c.name }}]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailpit.labels" $ctx | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    {{- include "mailpit.labels" $ctx | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  template:
    metadata:
      # Pas les selectorLabels d'oauth2-proxy : son Service sélectionnerait ce pod
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ $name }}
      restartPolicy: Never
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        runAsNonRoot: true
      containers:
        - name: generate
          image: {{ $c.generate.image | quote }}
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SECRET
              value: {{ $c.name | quote }}
            - name: KEY
              value: {{ $c.key | quote }}
            - name: HOME
              value: /tmp            # cache kubectl
          command:
            - sh
            - -ec
            - |
              if kubectl -n "$NAMESPACE" get secret "$SECRET" >/dev/null 2>&1; then
                echo "Secret $SECRET présent : conservé"
                exit 0
              fi
              # oauth2-proxy : secret de 16, 24 ou 32 octets (AES)
              VALUE="$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32)"
              kubectl -n "$NAMESPACE" create secret generic "$SECRET" --from-literal="$KEY=$VALUE"
              echo "Secret $SECRET créé"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
{{- end }}
