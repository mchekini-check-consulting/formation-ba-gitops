# Passerelle API d'UN (environnement x projet) — une release par
# (env, projet), namespace api-gateway-<env>-<projet>. Déployée par
# gitops/templates/business/api-gateway.yaml (ApplicationSet) : env et projet
# viennent de la matrice, applications du helm.yaml du projet (source $app).

# Environnement et projet servis : host api.<env>.<domain>, backends du
# namespace <env>-<projet>
env: ""
project: ""
domain: check-consulting.net

# Applications du projet (vient de son propre helm.yaml, pas saisi ici) :
#   - {name: backend, type: backend, ...}
#   - {name: frontend, type: frontend, ...}
# Route, une par application type: backend :
#   https://api.<env>.<domain>/<projet>/<backend>/... -> Service <backend>
#   (port nommé http) du namespace <env>-<projet>, préfixe retiré.
# CORS : les applications qui ne sont pas type: backend (frontends), sur leur
# host par défaut https://<composant>.<projet>.<env>.<domain>.
applications: []

# Origines CORS en plus (ex. frontend servi sur un host personnalisé)
extraOrigins: []
