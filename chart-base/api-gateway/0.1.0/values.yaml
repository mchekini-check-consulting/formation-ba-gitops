# Passerelle API d'un environnement (une release par environnement, namespace
# api-gateway-<env>). Déployée par gitops/templates/business/api-gateway.yaml :
# env et projects viennent du bloc business de gitops/values.yaml.

# Environnement servi : host api.<env>.<domain>, backends des namespaces <env>-<projet>
env: ""
domain: check-consulting.net

# Projets métier (business.projects) :
#   - name: formation-ba-scpi-invest
#     components: [backend, frontend]   # applications du helm.yaml
#     api: [backend]                     # backends routés par la passerelle
# Route : https://api.<env>.<domain>/<projet>/<backend>/... -> Service <backend>
# (port nommé http) du namespace <env>-<projet>, préfixe retiré.
# CORS : les composants qui ne sont pas dans api (frontends), sur leur host
# par défaut https://<composant>.<projet>.<env>.<domain>.
projects: []

# Origines CORS en plus (ex. frontend servi sur un host personnalisé)
extraOrigins: []
