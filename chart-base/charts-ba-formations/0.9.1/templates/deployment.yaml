{{- $env := required "env manquant (injecté par l'ApplicationSet)" .Values.env }}
{{- range $app := .Values.applications }}
{{- $ctx := dict "app" $app "root" $ }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $app.name }}
  labels:
    {{- include "gba.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ include "gba.byEnv" (dict "value" $app.replicas "env" $env) | default 1 }}
  selector:
    matchLabels:
      {{- include "gba.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "gba.labels" $ctx | nindent 8 }}
    spec:
      {{- if eq $app.type "gateway" }}
      # Gateway fourni par la plateforme : pas d'image/tag dans helm.yaml (rien à
      # construire ni à promouvoir), un petit Traefik autonome (fichier de
      # config, pas de CRD) dont les routes sont générées depuis les backends
      # du même projet (gateway-config.yaml, ConfigMap {{ $app.name }}-config).
      volumes:
        - name: dynamic
          configMap:
            name: {{ $app.name }}-config
      containers:
        - name: {{ $app.name }}
          image: "traefik:v3.7"
          args:
            - --entryPoints.web.address=:80
            - --providers.file.directory=/etc/traefik/dynamic
            - --providers.file.watch=true
            # X-Forwarded-For du Traefik principal accepté : ClientHost des logs
            # d'accès = IP réelle du client (gatewayTrustedIPs)
            - --entryPoints.web.forwardedHeaders.trustedIPs={{ required "gatewayTrustedIPs requis" $.Values.gatewayTrustedIPs | join "," }}
            # Logs JSON sur stdout, collectés par la plateforme (Alloy, source=gateway) :
            # accès (routeur = backend appelé, réponses des middlewares) et logs
            # propres (erreurs de configuration, de middleware). En-têtes jetés sauf
            # X-Forwarded-For (IP réelle du client derrière le Traefik principal) ;
            # paramètres de requête jetés.
            - --log.format=json
            - --accesslog=true
            - --accesslog.format=json
            - --accesslog.fields.headers.defaultmode=drop
            - --accesslog.fields.headers.names.X-Forwarded-For=keep
            - --accesslog.fields.queryparameters.defaultmode=drop
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: dynamic
              mountPath: /etc/traefik/dynamic
      {{- else }}
      containers:
        - name: {{ $app.name }}
          image: "{{ $app.image }}:{{ include "gba.byEnv" (dict "value" $app.tag "env" $env) | required (printf "tag manquant pour %s en %s" $app.name $env) }}"
          ports:
            - name: http
              containerPort: {{ $app.containerPort | default 8080 }}
          {{- $db := include "gba.dbName" $app }}
          {{- if or $db $app.envList }}
          env:
            {{- if $db }}
            # Base PostgreSQL (database), avant envList : envList peut s'en servir ($(PGHOST)...)
            {{- include "gba.dbEnv" (dict "db" $db) | nindent 12 }}
            {{- end }}
            {{- range $app.envList }}
            - name: {{ .key }}
              value: {{ include "gba.byEnv" (dict "value" .value "env" $env) | quote }}
            {{- end }}
          {{- end }}
      {{- end }}
{{- end }}
