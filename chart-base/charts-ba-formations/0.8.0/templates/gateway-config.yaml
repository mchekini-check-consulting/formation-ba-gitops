{{- /* Routes du pod "gateway" (type: gateway) d'un projet : une par backend
       (type: backend) DU MÊME helm.yaml, préfixe retiré, vers son Service
       ClusterIP. CORS : origines des applications qui ne sont ni backend ni
       gateway (frontends), sur leur host par défaut.
       Remplace la passerelle partagée api-gateway : plus besoin de dupliquer
       une liste "components"/"api" dans gitops, tout vient de CE helm.yaml. */}}
{{- range $gw := .Values.applications }}
{{- if eq $gw.type "gateway" }}
{{- $backends := list }}
{{- $origins := list }}
{{- range $app := $.Values.applications }}
{{- if eq $app.type "backend" }}
{{- $backends = append $backends $app }}
{{- else if ne $app.type "gateway" }}
{{- $origins = append $origins $app }}
{{- end }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $gw.name }}-config
  labels:
    {{- include "gba.labels" (dict "app" $gw "root" $) | nindent 4 }}
data:
  routes.yml: |
    http:
      routers:
        {{- range $backends }}
        {{ .name }}:
          rule: "PathPrefix(`/{{ .name }}`)"
          service: {{ .name }}
          middlewares: ["{{ .name }}-strip"{{ if $origins }}, "cors"{{ end }}]
        {{- end }}
      middlewares:
        {{- range $backends }}
        {{ .name }}-strip:
          stripPrefix:
            prefixes: ["/{{ .name }}"]
        {{- end }}
        {{- if $origins }}
        cors:
          headers:
            accessControlAllowOriginList:
              {{- range $origins }}
              - https://{{ include "gba.frontHost" (dict "app" . "root" $) }}
              {{- end }}
            accessControlAllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            accessControlAllowHeaders: [Content-Type, Authorization]
            accessControlMaxAge: 600
            addVaryHeader: true
        {{- end }}
      services:
        {{- range $backends }}
        {{ .name }}:
          loadBalancer:
            servers:
              - url: "http://{{ .name }}:{{ (.service).port | default 80 }}"
        {{- end }}
{{- end }}
{{- end }}
