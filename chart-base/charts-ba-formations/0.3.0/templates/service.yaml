{{- range $app := .Values.applications }}
{{- $ctx := dict "app" $app "root" $ }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $app.name }}
  labels:
    {{- include "gba.labels" $ctx | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "gba.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ ($app.service).port | default 80 }}
      targetPort: http
{{- end }}
