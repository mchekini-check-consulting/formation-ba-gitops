{{- /* Exposition des frontends et des gateways (et de toute application qui
       n'est pas un backend, avec ingress.enabled) : un host propre par
       application,
         https://<application>.<project>.<env>.<domain>  (ou ingress.host)
       couvert par le certificat du projet (certificate.yaml).
       Les backends n'ont jamais d'Ingress directement : Service ClusterIP
       seulement, exposé par le pod gateway du projet (type: gateway, voir
       gateway-config.yaml) s'il en a un. */}}
{{- range $app := .Values.applications }}
{{- $ing := $app.ingress | default dict }}
{{- if and $ing.enabled (ne $app.type "backend") (include "gba.deployed" (dict "app" $app "env" $.Values.env)) }}
{{- $ctx := dict "app" $app "root" $ }}
{{- $host := include "gba.frontHost" $ctx }}
{{- $path := $ing.path | default "/" }}
{{- if $ing.stripPrefix }}
---
# Retire le préfixe avant d'envoyer la requête au pod
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $app.name }}-strip
  labels:
    {{- include "gba.labels" $ctx | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - {{ $path }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $app.name }}
  labels:
    {{- include "gba.labels" $ctx | nindent 4 }}
  {{- if $ing.stripPrefix }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ $.Release.Namespace }}-{{ $app.name }}-strip@kubernetescrd
  {{- end }}
spec:
  ingressClassName: {{ $.Values.ingressClassName }}
  tls:
    - hosts:
        - {{ $host }}
      secretName: {{ include "gba.tlsSecret" $ }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $app.name }}
                port:
                  name: http
{{- end }}
{{- end }}
