apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "airflow.fullname" . }}
  labels:
    {{- include "airflow.labels" . | nindent 4 }}
spec:
  replicas: 1                 # standalone + SQLite : une seule instance
  strategy:
    type: Recreate            # l'ancien pod libere le volume avant le nouveau
  selector:
    matchLabels:
      {{- include "airflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "airflow.selectorLabels" . | nindent 8 }}
    spec:
      # uid 50000 = utilisateur "airflow" de l'image officielle
      securityContext:
        runAsUser: 50000
        fsGroup: 0
      # Le pidfile du webserver survit sur le volume persistant apres un arret
      # brutal (strategie Recreate). Au redemarrage, Airflow le trouve et
      # croit qu'un webserver tourne deja (un PID du nouveau conteneur
      # coincide par hasard avec l'ancien), et ne bind jamais vraiment le
      # port -- blocage silencieux, sans erreur dans les logs.
      initContainers:
        - name: cleanup-stale-pidfile
          image: busybox:1.36
          command: ["sh", "-c", "rm -f /opt/airflow/airflow-webserver.pid"]
          volumeMounts:
            - name: data
              mountPath: /opt/airflow
      containers:
        - name: airflow
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["airflow", "standalone"]
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- if .Values.fernetKeySecret.name }}
            # Chiffre les Connections/Variables stockees dans la base interne.
            # Secret cree a la main (jamais dans Git) :
            #   kubectl -n airflow create secret generic {{ .Values.fernetKeySecret.name }} \
            #     --from-literal={{ .Values.fernetKeySecret.key }}=<cle generee avec Fernet.generate_key()>
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.fernetKeySecret.name }}
                  key: {{ .Values.fernetKeySecret.key }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # Demarrage lent (init DB SQLite + creation de l'utilisateur admin)
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /opt/airflow
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "airflow.fullname" . }}-data
