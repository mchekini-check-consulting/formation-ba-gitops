{{- range $app := .Values.applications }}
{{- $ing := $app.ingress | default dict }}
{{- if $ing.enabled }}
{{- $ctx := dict "app" $app "root" $ }}
{{- $path := $ing.path | default "/" }}
{{- /* Un host par application : <application>.<project>.<env>.<domain>,
       couvert par le certificat *.<project>.<env>.<domain> (certificate.yaml) */}}
{{- $host := $ing.host | default (printf "%s.%s.%s.%s" $app.name $.Values.project $.Values.env $.Values.domain) }}
{{- if $ing.stripPrefix }}
---
# Retire le préfixe (ex. /api) avant d'envoyer la requête au pod
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $app.name }}-strip
  labels:
    {{- include "gba.labels" $ctx | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - {{ $path }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $app.name }}
  labels:
    {{- include "gba.labels" $ctx | nindent 4 }}
  {{- if $ing.stripPrefix }}
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ $.Release.Namespace }}-{{ $app.name }}-strip@kubernetescrd
  {{- end }}
spec:
  ingressClassName: {{ $.Values.ingressClassName }}
  tls:
    - hosts:
        - {{ $host }}
      secretName: {{ include "gba.tlsSecret" $ }}
  rules:
    - host: {{ $host }}
      http:
        paths:
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ $app.name }}
                port:
                  name: http
{{- end }}
{{- end }}
