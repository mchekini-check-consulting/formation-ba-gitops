# Construit l'image d'un dossier et la pousse dans ECR via OIDC.
# Image : <registre ECR>/<dépôt>/<dossier>:<tag>
# Prérequis : checkout + permissions id-token: write sur le job.
name: build-push
description: Build et push d'une image dans ECR

inputs:
  component:
    description: Dossier contenant le Dockerfile (backend, frontend, ...)
    required: true
  tag:
    description: Tag de l'image (sha court)
    required: true
  role-to-assume:
    description: Rôle IAM assumé via OIDC
    default: arn:aws:iam::205493924920:role/role-team-eks-dev-gha-formation-ba
  aws-region:
    default: eu-west-3

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
    - id: ecr
      uses: aws-actions/amazon-ecr-login@v2
    - uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.component }}
        push: true
        provenance: false
        tags: ${{ steps.ecr.outputs.registry }}/${{ github.event.repository.name }}/${{ inputs.component }}:${{ inputs.tag }}
