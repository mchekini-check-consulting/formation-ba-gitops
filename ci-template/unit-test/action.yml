# Tests unitaires + couverture d'un composant : "make test-unit", défini dans le Makefile
# du composant. Les rapports (couverture, classes Java compilées) sont publiés dans
# l'artifact unit-test-<composant>, que l'action sonarqube (job suivant) récupère.
name: unit-test
description: Tests unitaires et couverture d'un composant

inputs:
  component:
    required: true

runs:
  using: composite
  steps:
    - uses: mchekini-check-consulting/formation-ba-gitops/ci-template/setup@main
      with:
        component: ${{ inputs.component }}
    - shell: bash
      working-directory: ${{ inputs.component }}
      run: make test-unit
    # sonar-project.properties est toujours présent : il garde le dossier du composant comme
    # racine de l'artifact (sinon upload-artifact aplatit les chemins s'il n'y a qu'un rapport)
    - uses: actions/upload-artifact@v4
      with:
        name: unit-test-${{ inputs.component }}
        path: |
          ${{ inputs.component }}/sonar-project.properties
          ${{ inputs.component }}/coverage
          ${{ inputs.component }}/coverage.xml
          ${{ inputs.component }}/target/classes
          ${{ inputs.component }}/target/test-classes
          ${{ inputs.component }}/target/site/jacoco
        retention-days: 1
