# Tests d'intégration d'un composant : "make test-integration", défini dans le Makefile
# du composant.
name: integration-test
description: Tests d'intégration d'un composant

inputs:
  component:
    required: true

runs:
  using: composite
  steps:
    - uses: mchekini-check-consulting/formation-ba-gitops/ci-template/setup@main
      with:
        component: ${{ inputs.component }}
    - shell: bash
      working-directory: ${{ inputs.component }}
      run: make test-integration
