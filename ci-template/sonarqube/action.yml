# Analyse SonarQube d'un composant puis attente du quality gate : échoue si le gate est rouge.
# Job à lancer après unit-test : récupère ses rapports (artifact unit-test-<composant>).
# Projet Sonar : <dépôt>-<composant>. Sources, tests et chemins des rapports :
# <composant>/sonar-project.properties. Prérequis : checkout avec fetch-depth: 0.
name: sonarqube
description: Analyse SonarQube + quality gate d'un composant

inputs:
  component:
    required: true
  token:
    description: Global Analysis Token (secret d'organisation SONAR_TOKEN)
    required: true
  host-url:
    description: SonarQube de la plateforme (gitops/values/dev/sonarqube.yaml)
    default: https://sonarqube.dev.check-consulting.net

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v4
      with:
        name: unit-test-${{ inputs.component }}
        path: ${{ inputs.component }}
    - uses: SonarSource/sonarqube-scan-action@v5
      env:
        SONAR_TOKEN: ${{ inputs.token }}
        SONAR_HOST_URL: ${{ inputs.host-url }}
      with:
        projectBaseDir: ${{ inputs.component }}
        args: >
          -Dsonar.projectKey=${{ github.event.repository.name }}-${{ inputs.component }}
          -Dsonar.qualitygate.wait=true
