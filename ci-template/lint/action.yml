# Linter d'un composant : "make lint", défini dans le Makefile du composant.
name: lint
description: Linter d'un composant

inputs:
  component:
    required: true

runs:
  using: composite
  steps:
    - uses: mchekini-check-consulting/formation-ba-gitops/ci-template/setup@main
      with:
        component: ${{ inputs.component }}
    - shell: bash
      working-directory: ${{ inputs.component }}
      run: make lint
