{{- /* Par dépôt : un Warehouse qui surveille l'image ECR de chaque composant.
       Un Freight = les tags de tous les composants du dépôt à un instant donné. */}}
{{- range $p := .Values.projects }}
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: {{ $p.name }}
  namespace: {{ $p.name }}
spec:
  interval: {{ $.Values.warehouse.interval }}
  freightCreationPolicy: Automatic
  subscriptions:
    {{- range $c := $p.components }}
    - image:
        repoURL: {{ include "kp.image" (dict "root" $ "project" $p.name "component" $c.name) }}
        imageSelectionStrategy: NewestBuild
        allowTagsRegexes:
          {{- toYaml $.Values.warehouse.allowTagsRegexes | nindent 10 }}
        discoveryLimit: {{ $.Values.warehouse.discoveryLimit }}
    {{- end }}
{{- end }}
