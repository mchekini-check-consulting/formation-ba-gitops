# CRDs fournies par crd-base/kube-prometheus-stack/<version>
crds:
  enabled: false

# Pas encore configuré
alertmanager:
  enabled: false

# Déjà déployé par ailleurs (SSO Keycloak)
grafana:
  enabled: false

kubeStateMetrics:
  enabled: false

nodeExporter:
  enabled: false

# Control plane managé par AWS sur EKS : endpoints non accessibles
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

prometheus:
  prometheusSpec:
    # Ouverts à tout le cluster : sinon Prometheus ignore les ServiceMonitor/PodMonitor/
    # PrometheusRule créés par les Applications des autres outils.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeConfigSelectorNilUsesHelmValues: false

    retention: 10d
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi
