# Values communes du chart kargo (promotion des images dev -> qualif -> preprod -> prod).
# Pipelines (Projects, Warehouses, Stages) : chart maison chart-base/kargo-pipelines,
# déployés par le chart racine (gitops/templates/business/kargo-pipelines.yaml).

# CRDs : crd-base/kargo/<version> (Application crds-kargo, wave -10)
crds:
  install: false

# Identifiants partagés par tous les Projects : namespace créé par le chart.
# Un seul Secret Git (PAT) pour les dépôts formation-ba-*, créé à la main :
#   kubectl -n kargo-shared-resources create secret generic kargo-git-creds \
#     --from-literal=repoURL='^https://github.com/mchekini-check-consulting/formation-ba-.*$' \
#     --from-literal=repoURLIsRegex=true \
#     --from-literal=username=<compte GitHub du PAT> --from-literal=password=<PAT>
#   kubectl -n kargo-shared-resources label secret kargo-git-creds kargo.akuity.io/cred-type=git
global:
  sharedResources:
    namespace: kargo-shared-resources

api:
  # Compte admin local, conservé en secours du SSO : hash et clé dans un Secret créé
  # à la main, jamais dans Git (clés ADMIN_ACCOUNT_PASSWORD_HASH, ADMIN_ACCOUNT_TOKEN_SIGNING_KEY)
  secret:
    name: kargo-admin
  adminAccount:
    enabled: true
    tokenTTL: 24h
  # SSO Keycloak (realm platform, client public kargo, PKCE) ; issuerURL : values/<env>.
  # Droits : matrice d'accès values/common/access.yaml (tools.kargo.roles), rôles du
  # client kargo reçus dans le claim "roles" :
  #   - global  : ServiceAccounts sso-<admin|viewer|user> du namespace kargo (extraObjects
  #               ci-dessous), liés aux ClusterRoles kargo-<admin|viewer|user> du chart
  #   - project : chart-base/kargo-pipelines (un ServiceAccount + RoleBinding par Project)
  # admins/viewers/users.claims du chart restent vides : tout vient de la matrice.
  oidc:
    enabled: true
    clientID: kargo
    additionalScopes: []       # Keycloak n'a pas de scope "groups" (défaut du chart)
    usernameClaim: email
  # TLS terminé par Traefik (wildcard *.<env>.check-consulting.net)
  tls:
    enabled: false
    terminatedUpstream: true
  ingress:
    enabled: true
    ingressClassName: traefik
    pathType: Prefix
    tls:
      enabled: false
  # Pas d'Argo Rollouts dans le cluster (pas de vérification par AnalysisTemplate)
  rollouts:
    integrationEnabled: false

controller:
  # Auteur des commits de promotion dans les helm.yaml
  gitClient:
    name: kargo-bot
    email: kargo-bot@users.noreply.github.com
    # Push concurrent d'un développeur sur main : rebase puis nouvelle tentative
    pushIntegrationPolicy: RebaseOrMerge
  rollouts:
    integrationEnabled: false
  argocd:
    namespace: argocd

# Pas de webhooks entrants (GitHub/ECR) : les Warehouses interrogent ECR (polling)
externalWebhooksServer:
  enabled: false

# Droits globaux SSO depuis values/common/access.yaml : un ServiceAccount par niveau
# (admin, viewer, user), annoté avec les rôles Keycloak qui y donnent droit. L'API Kargo
# associe un utilisateur aux ServiceAccounts annotés du namespace kargo dont les claims
# correspondent à son jeton, puis applique leurs ClusterRoles.
extraObjects:
  - |
    {{- with .Values.access }}
    {{- $levels := dict }}
    {{- range $role, $r := .tools.kargo.roles }}
    {{- $level := $r.global | default "user" }}
    {{- if not (has $level (list "admin" "viewer" "user")) }}
    {{- fail (printf "access.tools.kargo.roles.%s.global : admin, viewer ou user (reçu %s)" $role $level) }}
    {{- end }}
    {{- $_ := set $levels $level (append (get $levels $level | default list) $role) }}
    {{- end }}
    {{- range $level, $roles := $levels }}
    ---
    apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: sso-{{ $level }}
      namespace: {{ $.Release.Namespace }}
      annotations:
        rbac.kargo.akuity.io/claims: {{ dict "roles" $roles | toJson | quote }}
    ---
    apiVersion: rbac.authorization.k8s.io/v1
    kind: ClusterRoleBinding
    metadata:
      name: kargo-sso-{{ $level }}
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: ClusterRole
      name: kargo-{{ $level }}
    subjects:
      - kind: ServiceAccount
        name: sso-{{ $level }}
        namespace: {{ $.Release.Namespace }}
    {{- end }}
    {{- end }}
