# Base PostgreSQL de Keycloak : chart cnpg-cluster (ressource Cluster CloudNativePG).
# L'opérateur crée :
#   - le Service keycloak-db-rw (lecture/écriture)
#   - le Secret keycloak-db-app (username, password, ...) lu par Keycloak
#   - le Secret keycloak-db-superuser (postgres) : connexion admin depuis CloudBeaver
fullnameOverride: keycloak-db

cluster:
  # Jamais supprimé par ArgoCD (prune, suppression de l'Application, erreur de
  # chemin ou de nom) : supprimer la base est un geste manuel (kubectl delete).
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  initdb:
    database: keycloak
    owner: keycloak
  enableSuperuserAccess: true    # superuser postgres, utilisé par CloudBeaver
  storage:
    size: 2Gi        # StorageClass par défaut du cluster (gp3, addon EBS CSI)
