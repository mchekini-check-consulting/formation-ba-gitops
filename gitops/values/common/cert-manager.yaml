# Values communes du chart cert-manager.
# Le ClusterIssuer et les Certificate sont dans values/<env>/cert-manager.yaml
# (extraObjects) : le schéma du chart refuse les clés inconnues et Helm ne
# fusionne pas les listes, chaque environnement porte donc sa liste complète.
crds:
  enabled: false   # CRDs fournies par crd-base/cert-manager/<version>

# Nom lié au rôle IAM par l'association EKS Pod Identity (Terraform,
# live-infrastructure/aws/modules/cert-manager) : écrit le TXT _acme-challenge
serviceAccount:
  create: true
  name: cert-manager
