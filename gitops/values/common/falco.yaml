# Values communes du chart falco (détection d'anomalies runtime, DaemonSet).
# Sortie (alertes) en stdout, récupérée comme tout autre log de pod.
driver:
  kind: modern_ebpf   # pas de headers kernel nécessaires (AMI EKS standard)
  modernEbpf:
    leastPrivileged: true   # capacités ciblées plutôt qu'un conteneur privileged

# Règles custom en plus du jeu de règles par défaut du chart.
customRules: {}
  # rules-formation-ba.yaml: |
  #   - rule: ...
  #     desc: ...
  #     condition: ...
  #     output: ...
  #     priority: ...
