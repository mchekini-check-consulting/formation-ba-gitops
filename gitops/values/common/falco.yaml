# Values communes du chart falco (détection d'anomalies runtime, DaemonSet).
# Sortie (alertes) en stdout, récupérée comme tout autre log de pod.
driver:
  kind: modern_ebpf   # pas de headers kernel nécessaires (AMI EKS standard)
  modernEbpf:
    leastPrivileged: true   # capacités ciblées plutôt qu'un conteneur privileged

# Règles custom en plus du jeu de règles par défaut du chart.
# Chargées depuis /etc/falco/rules.d, après falco_rules.yaml (défaut) : une macro
# redéfinie ici écrase la définition par défaut, sans dupliquer la règle entière.
customRules:
  rules-formation-ba.yaml: |
    # La règle par défaut "Contact K8S API Server From Container" prévoit explicitement
    # ce point d'extension (macro à (never_true) par défaut) : les opérateurs de la
    # plateforme qui parlent légitimement à l'API K8s sont listés ici, le reste continue
    # de déclencher l'alerte normalement.
    - macro: user_known_contact_k8s_api_server_activities
      condition: >
        (container.image.repository in (
          ghcr.io/cloudnative-pg/cloudnative-pg,
          ghcr.io/cloudnative-pg/postgresql,
          ghcr.io/cloudnative-pg/plugin-barman-cloud-sidecar,
          ghcr.io/akuity/kargo
        ))
