# Base interne de CloudBeaver : chart cnpg-cluster (ressource Cluster CloudNativePG).
# L'opérateur crée :
#   - le Service cloudbeaver-db-rw
#   - le Secret cloudbeaver-db-app (password lu par CloudBeaver)
#   - le Secret cloudbeaver-db-superuser (postgres)
fullnameOverride: cloudbeaver-db

cluster:
  initdb:
    database: cloudbeaver
    owner: cloudbeaver
  enableSuperuserAccess: true    # superuser postgres, utilisé par CloudBeaver
  storage:
    size: 2Gi        # StorageClass par défaut du cluster (gp3, addon EBS CSI)
