# Values communes du chart cloudnative-pg (opérateur PostgreSQL).
# Chaque base est une ressource Cluster dans le namespace de son consommateur
# (outil de la plateforme ou application dev), déclarée dans values/<common|env>/databases.yaml
# et rendue par pg-lib (chart-base/pg-lib).
crds:
  create: false   # CRDs fournies par crd-base/cloudnative-pg/<version>
