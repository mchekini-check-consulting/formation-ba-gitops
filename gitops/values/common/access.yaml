# Matrice d'accès de la plateforme : SEUL endroit où l'on déclare
#   - les rôles de chaque outil et ce qu'ils permettent (tools)
#   - les droits de chaque groupe Keycloak (groups)
# Les utilisateurs et leurs groupes : values/<env>/keycloak-config.yaml.
#
# Lue (valueFile commun, voir tools.<outil>.access dans gitops/values.yaml) par :
#   keycloak-config   rôles des clients, groupes, MFA, mappers SAML       (realm access.realm)
#   argocd            ConfigMap argocd-rbac-cm                             (values/common/argocd.yaml)
#   kargo             droits globaux : ServiceAccounts sso-* du namespace kargo
#   sonarqube-config  groupes SonarQube et leurs permissions
#   kargo-pipelines   droits dans chaque Project (formation-ba-gitops/business)
# Un nom de rôle ou de groupe inconnu fait échouer le rendu (keycloak-config).
#
# Prise en compte : se déconnecter puis se reconnecter à l'outil (rôles dans le jeton).
access:
  # Realm des outils (clients déclarés dans values/common/keycloak-config.yaml)
  realm: platform

  tools:
    # Kargo. global : droits sur toute l'instance (ClusterRole kargo-<global>) ;
    #   admin | viewer | user (user : voir la liste des Projects, minimum pour un rôle "project").
    # project : Role créé par Kargo dans chaque Project (kargo-admin | kargo-promoter | kargo-viewer)
    # projectRules : à la place de project, Role sur mesure créé dans chaque Project, ex.
    #   promoteur sans la prod :
    #     - {apiGroups: [kargo.akuity.io], resources: [stages], resourceNames: [dev, qualif], verbs: [promote]}
    kargo:
      roles:
        admin:
          global: admin
        viewer:
          global: viewer
        promoter:
          global: user
          project: kargo-promoter

    # ArgoCD. argocdRole : rôle existant (role:admin, role:readonly) ;
    # policies : à la place d'argocdRole, règles "<ressource>, <action>, <AppProject>/<Application>,
    #   allow|deny" d'un rôle sur mesure role:sso-<rôle>, ex. un rôle deployer :
    #     deployer:
    #       policies:
    #         - applications, get, */*, allow
    #         - applications, sync, */*, allow
    argocd:
      roles:
        admin:
          argocdRole: role:admin
        readonly:
          argocdRole: role:readonly

    # SonarQube (SAML). group : groupe SonarQube attribué à la connexion (synchronisé à
    #   chaque connexion ; un ajout manuel dans l'interface est retiré) ;
    # permissions : permissions globales du groupe (admin, gateadmin, profileadmin,
    #   provisioning, scan). Groupe hors sonar-administrators / sonar-users : créé et
    #   aligné par sonarqube-config (jeton admin requis, voir chart-base/sonarqube-config).
    #   ex. quality-admin: {group: sonar-quality-admins, permissions: [gateadmin, profileadmin]}
    # Sans group : sonar-users seulement (attribué à tout utilisateur connecté).
    sonarqube:
      roles:
        admin:
          group: sonar-administrators
        user: {}

    # Grafana (logs). Rôle Keycloak -> rôle Grafana (role_attribute_path, values/<env>/grafana.yaml) :
    #   admin  -> GrafanaAdmin (administration de l'instance, organisation comprise)
    #   editor -> Editor (explorer, créer des dashboards personnels ; ceux des values restent en lecture seule)
    #   viewer -> Viewer (lecture des dashboards, Explore désactivé pour ce rôle)
    # Sans aucun de ces rôles : connexion refusée (role_attribute_strict).
    grafana:
      roles:
        admin: {}
        editor: {}
        viewer: {}

  # Groupes Keycloak : rôles par outil. mfa: true : code OTP exigé à chaque connexion
  # (configuration de l'application d'authentification imposée à la première).
  groups:
    platform-admins:
      mfa: true
      roles:
        kargo: [admin]
        argocd: [admin]
        sonarqube: [admin]
        grafana: [admin]
    ba:
      roles:
        kargo: [promoter]
        argocd: [readonly]
        sonarqube: [user]
        grafana: [viewer]
    dev-team:
      roles:
        kargo: [viewer]
        argocd: [readonly]
        sonarqube: [user]
        grafana: [viewer]
