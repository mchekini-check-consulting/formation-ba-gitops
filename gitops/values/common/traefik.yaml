# Values communes du chart traefik : ingress controller par défaut du cluster.
deployment:
  replicas: 2

ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik

providers:
  kubernetesCRD:
    enabled: true
    # Middleware (stripPrefix) des Ingress frontend/gateway avec ingress.stripPrefix
    # (charts-ba-formations). Seule la plateforme peut créer des IngressRoute :
    # absents de la liste blanche des AppProjects métier.
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true   # status.loadBalancer des Ingress = adresse du NLB
  kubernetesGateway:
    enabled: false    # CRDs Gateway API non installées (cf. crd-base/catalog.yaml)

# Un seul NLB par cluster, créé par le Service de Traefik (type LoadBalancer par défaut)
service:
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
  # Local : le NLB n'envoie qu'aux nœuds qui portent un pod Traefik, sans SNAT ;
  # Traefik voit la vraie IP du client (ClientHost des logs d'accès, IP du client
  # dans X-Forwarded-For vers les applications). Les nœuds sans pod Traefik sont
  # marqués non sains par le health check du NLB (normal).
  spec:
    externalTrafficPolicy: Local

podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# HTTPS : le port 80 redirige vers 443 pour tout le cluster
ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

# Certificat présenté par tout routeur sur websecure (TLS activé par défaut par
# le chart) : wildcard *.<env>.check-consulting.net de l'environnement, émis par
# cert-manager (values/<env>/cert-manager.yaml). Aucun Ingress n'a besoin de section tls.
# Tant que le Secret n'existe pas, Traefik sert son certificat auto-signé.
tlsStore:
  default:
    defaultCertificate:
      secretName: wildcard-check-consulting-tls

# Logs d'accès JSON sur stdout, collectés par Alloy (log_type=http_access, dashboard
# HTTP de grafana-dashboards). Champs utilisés : ClientHost, DownstreamStatus,
# RequestContentSize (octets reçus du client), DownstreamContentSize (octets envoyés),
# RequestHost, RequestMethod, Duration. En-têtes jetés (cookies, Authorization) sauf
# User-Agent ; paramètres de requête jetés (jetons éventuels dans l'URL).
accessLog:
  enabled: true
  format: json
  fields:
    defaultMode: keep
    headers:
      defaultMode: drop
      names:
        User-Agent: keep
    queryParameters:
      defaultMode: drop

# Logs propres de Traefik en JSON aussi (non collectés, mais lisibles avec kubectl logs | jq)
log:
  format: json
