# Values communes du chart grafana (grafana-community) : visualisation des logs.
#   - connexion : SSO Keycloak uniquement (client confidentiel grafana du realm platform,
#     PKCE), formulaire de connexion désactivé ; rôle Grafana = rôle du client
#     (matrice d'accès values/common/access.yaml), sans rôle : accès refusé
#   - base : Cluster CloudNativePG grafana-db (Application grafana-db, wave 20)
#   - datasources (fichiers des values, non modifiables dans l'interface) :
#       Loki (logs du cluster) et CloudWatch (logs du control plane EKS, rôle IAM de
#       formation-ba-landingzone aws/environments/<env>/logs, Pod Identity sur
#       logging/grafana)
#   - dashboards : aucun livré par le chart ; uniquement ceux du chart maison
#     grafana-dashboards (ConfigMaps label grafana_dashboard, sidecar), tous
#     désactivés par défaut et activés par environnement
# URL et domaine Keycloak : values/<env>/grafana.yaml.

serviceAccount:
  create: true
  name: grafana   # = grafana_service_account du module Terraform logs

replicas: 1

resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    memory: 512Mi

# Sessions et préférences dans PostgreSQL : pas de PVC
persistence:
  enabled: false

# Secrets lus en variables d'environnement, jamais dans grafana.ini (ConfigMap)
envValueFrom:
  # Secret copié depuis keycloak par keycloak-config (clientSecretCopy)
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
    secretKeyRef:
      name: grafana-oauth
      key: client-secret
  # Secret créé par CloudNativePG (Cluster grafana-db, rôle grafana)
  GF_DATABASE_PASSWORD:
    secretKeyRef:
      name: grafana-db-app
      key: password

grafana.ini:
  analytics:
    reporting_enabled: false
    check_for_updates: false
    check_for_plugin_updates: false
  news:
    news_feed_enabled: false
  database:
    type: postgres
    host: grafana-db-rw:5432
    name: grafana
    user: grafana
    ssl_mode: require
  users:
    allow_sign_up: false
    # Viewer : lecture des dashboards seulement (pas d'Explore)
    viewers_can_edit: false
  auth:
    disable_login_form: true
    oauth_allow_insecure_email_lookup: false
  auth.basic:
    enabled: false
  auth.anonymous:
    enabled: false
  # Endpoints Keycloak : values/<env>/grafana.yaml (auth_url, token_url, api_url,
  # signout_redirect_url, qui dépendent du domaine)
  auth.generic_oauth:
    enabled: true
    name: Keycloak
    client_id: grafana
    scopes: openid profile email
    use_pkce: true
    use_refresh_token: true
    auto_login: true
    allow_sign_up: true
    login_attribute_path: preferred_username
    name_attribute_path: name
    email_attribute_path: email
    # Claim "roles" (mapper client-roles de keycloak-config) -> rôle Grafana.
    # admin -> GrafanaAdmin (allow_assign_grafana_admin), editor -> Editor, viewer -> Viewer ;
    # aucun rôle -> chaîne vide -> connexion refusée (role_attribute_strict)
    role_attribute_path: "contains(roles[*], 'admin') && 'GrafanaAdmin' || contains(roles[*], 'editor') && 'Editor' || contains(roles[*], 'viewer') && 'Viewer' || ''"
    role_attribute_strict: true
    allow_assign_grafana_admin: true
    skip_org_role_sync: false
  # Pod Identity : chaîne de credentials AWS par défaut (pas de clé)
  aws:
    allowed_auth_providers: default
    assume_role_enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    # Datasources des values uniquement : celles créées à la main sont supprimées
    prune: true
    datasources:
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki.logging.svc.cluster.local:3100
        isDefault: true
        editable: false
        jsonData:
          maxLines: 1000
          timeout: 120
      # Logs du control plane EKS (api, audit). Groupe : dashboard infra
      # (grafana-dashboards, eksLogGroup).
      - name: CloudWatch
        uid: cloudwatch
        type: cloudwatch
        access: proxy
        editable: false
        jsonData:
          authType: default
          defaultRegion: eu-west-3

# Dashboards : rien de livré par le chart, seulement les ConfigMaps du chart
# grafana-dashboards (même namespace), un dossier par annotation grafana_folder,
# en lecture seule ; ConfigMap supprimée = dashboard supprimé.
dashboards: {}
dashboardProviders: {}
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    folderAnnotation: grafana_folder
    provider:
      name: grafana-dashboards
      allowUiUpdates: false
      disableDelete: false
      foldersFromFilesStructure: true
  datasources:
    enabled: false

testFramework:
  enabled: false

ingress:
  enabled: true
  ingressClassName: traefik
  path: /
  pathType: Prefix

# Compte admin local (secours ; formulaire de connexion désactivé, l'administration
# passe par le rôle Keycloak admin -> GrafanaAdmin). Secret grafana-admin généré une
# fois par un Job PreSync (extraObjects ci-dessous), comme CloudBeaver : sans lui, le
# chart tire un mot de passe aléatoire à chaque rendu (Application toujours OutOfSync).
#   kubectl -n logging get secret grafana-admin -o jsonpath='{.data.admin-password}' | base64 -d
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password

extraObjects:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: grafana-admin-secret
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/sync-wave: "-1"
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: Role
    metadata:
      name: grafana-admin-secret
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/sync-wave: "-1"
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    rules:
      # Lire uniquement ce Secret ; create ne peut pas être restreint par nom
      - apiGroups: [""]
        resources: [secrets]
        resourceNames: [grafana-admin]
        verbs: [get]
      - apiGroups: [""]
        resources: [secrets]
        verbs: [create]
  - apiVersion: rbac.authorization.k8s.io/v1
    kind: RoleBinding
    metadata:
      name: grafana-admin-secret
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/sync-wave: "-1"
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    roleRef:
      apiGroup: rbac.authorization.k8s.io
      kind: Role
      name: grafana-admin-secret
    subjects:
      - kind: ServiceAccount
        name: grafana-admin-secret
        namespace: logging
  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: grafana-admin-secret
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/sync-wave: "0"
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana-admin-secret
        spec:
          serviceAccountName: grafana-admin-secret
          restartPolicy: Never
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
          containers:
            - name: generate
              image: alpine/k8s:1.31.13      # kubectl + sh, multi-arch (amd64, arm64)
              env:
                - name: HOME
                  value: /tmp                # cache kubectl
              command:
                - sh
                - -ec
                - |
                  if kubectl -n logging get secret grafana-admin >/dev/null 2>&1; then
                    echo "Secret grafana-admin présent : conservé"
                    exit 0
                  fi
                  PASS="$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 32)"
                  kubectl -n logging create secret generic grafana-admin \
                    --from-literal=admin-user=admin --from-literal=admin-password="$PASS"
                  echo "Secret grafana-admin créé"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
