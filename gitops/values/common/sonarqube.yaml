# Values communes du chart sonarqube (édition Community).
community:
  enabled: true

# Base : Cluster CloudNativePG sonarqube-db (Application sonarqube-db, wave 20).
# Mot de passe lu dans le Secret généré par l'opérateur : rien en clair dans Git.
jdbcOverwrite:
  enabled: true
  jdbcUrl: jdbc:postgresql://sonarqube-db-rw:5432/sonarqube
  jdbcUsername: sonarqube
  jdbcSecretName: sonarqube-db-app
  jdbcSecretPasswordKey: password

# Passcode exigé par le chart (endpoints de monitoring, sonde liveness).
# Réutilise le mot de passe aléatoire du Secret CloudNativePG pour ne pas
# stocker de secret dans Git. À remplacer par un secret dédié quand un
# gestionnaire de secrets sera en place.
monitoringPasscodeSecretName: sonarqube-db-app
monitoringPasscodeSecretKey: password

# Données SonarQube (index Elasticsearch, plugins) : StorageClass par défaut (gp3)
persistence:
  enabled: true
  size: 5Gi

# Pod de test Helm (helm test) : inutile avec ArgoCD
tests:
  enabled: false

# SSO Keycloak en SAML (realm platform, client sonarqube : values/common/keycloak-config.yaml).
# Réglages posés dans sonar.properties : en lecture seule dans l'interface.
# URL de Keycloak et de SonarQube : values/<env>/sonarqube.yaml.
# Groupes synchronisés à chaque connexion : rôle admin du client -> sonar-administrators.
# Le compte admin local reste actif (secours du SSO).
sonarProperties:
  sonar.auth.saml.enabled: "true"
  sonar.auth.saml.applicationId: sonarqube
  sonar.auth.saml.providerName: Keycloak
  sonar.auth.saml.user.login: login
  sonar.auth.saml.user.name: name
  sonar.auth.saml.user.email: email
  sonar.auth.saml.group.name: groups

# Certificat de la clé de signature fixée du realm platform (Certificate cert-manager du
# chart keycloak-config), copié par keycloak-config (Job PostSync, wave 35) dans le Secret
# sonarqube-saml-idp ; d'où la wave 40 de SonarQube. La clé ne change que sur rotation
# volontaire : redémarrer alors SonarQube (kubectl -n sonarqube rollout restart sts/sonarqube-sonarqube).
# Groupes et permissions SonarQube : matrice d'accès (values/common/access.yaml), chart sonarqube-config.
env:
  - name: SONAR_AUTH_SAML_CERTIFICATE_SECURED
    valueFrom:
      secretKeyRef:
        name: sonarqube-saml-idp
        key: certificate
