# Values communes du chart loki (grafana-community) : stockage des logs du cluster.
# Mode Monolithic (un seul binaire, StatefulSet) : 4 VM de 8 Go, quelques Go de
# logs par jour ; le mode distribué coûterait plus que les applications.
# Objets (chunks, index TSDB) sur S3 : bucket et rôle IAM de formation-ba-landingzone
# (aws/environments/<env>/logs), donnés au pod par Pod Identity (ServiceAccount loki).
# Lu par Grafana (datasource Loki) ; écrit par Alloy. Pas d'Ingress : Service ClusterIP.
deploymentMode: Monolithic

serviceAccount:
  create: true
  name: loki   # = loki_service_account du module Terraform logs

loki:
  # Un seul tenant : pas d'en-tête X-Scope-OrgID côté Alloy et Grafana
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  # Bucket : values/<env>/loki.yaml. Pas de clé d'accès : chaîne de credentials
  # AWS par défaut (Pod Identity).
  storage:
    type: s3
    s3:
      region: eu-west-3

  schemaConfig:
    configs:
      - from: "2026-10-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  ingester:
    chunk_encoding: snappy

  querier:
    max_concurrent: 2

  # Seuils : rétention (compactor) et limites d'ingestion, pour qu'un pod bavard
  # ne sature ni Loki ni S3. Au-delà, Loki répond 429 et Alloy réessaie.
  # retention_period : values/<env>/loki.yaml (= retention_days du module Terraform logs).
  limits_config:
    retention_period: 720h
    ingestion_rate_mb: 8              # par tenant, toutes sources confondues
    ingestion_burst_size_mb: 16
    per_stream_rate_limit: 3MB        # un flux (un conteneur) ne peut pas tout prendre
    per_stream_rate_limit_burst: 6MB
    max_global_streams_per_user: 5000 # garde-fou contre l'explosion des labels
    max_label_names_per_series: 12
    max_line_size: 256KB
    max_line_size_truncate: true      # ligne tronquée plutôt que rejetée
    reject_old_samples: true
    reject_old_samples_max_age: 168h
    max_query_lookback: 720h
    max_query_series: 1000
    query_timeout: 300s
    split_queries_by_interval: 15m
    volume_enabled: true
    allow_structured_metadata: true

  # Rétention appliquée par le compactor (suppression dans S3)
  compactor:
    working_directory: /var/loki/compactor
    compaction_interval: 10m
    retention_enabled: true
    retention_delete_delay: 2h
    delete_request_store: s3

  pattern_ingester:
    enabled: false

  analytics:
    reporting_enabled: false

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi           # WAL et cache local ; les données sont sur S3
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 1536Mi
  extraEnv:
    - name: GOMEMLIMIT
      value: 1400MiB     # un peu sous la limite mémoire

# Désactivés : tout ce que le chart déploie en plus par défaut
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
minio:
  enabled: false
sidecar:
  rules:
    enabled: false
monitoring:
  dashboards:
    enabled: false
  rules:
    enabled: false
  serviceMonitor:
    enabled: false

# Composants des autres modes de déploiement
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomPlanner:
  replicas: 0
bloomBuilder:
  replicas: 0
bloomGateway:
  replicas: 0
