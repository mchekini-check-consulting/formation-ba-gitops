# dev : une seule instance de chaque composant (défauts du chart)

global:
  domain: argocd.dev.check-consulting.net

# URL : le chart déduit https://<global.domain>.

# SSO Keycloak : client public argocd du realm platform, PKCE (pas de secret).
# Bouton "LOG IN VIA KEYCLOAK" ; CLI : argocd login argocd.dev.check-consulting.net --sso --grpc-web
configs:
  cm:
    oidc.config: |
      name: Keycloak
      issuer: https://keycloak.dev.check-consulting.net/realms/platform
      clientID: argocd
      enablePKCEAuthentication: true
      requestedScopes: ["openid", "profile", "email"]

# Ingress servi par Traefik ; external-dns crée l'ALIAS argocd.dev.check-consulting.net -> NLB.
# HTTPS : wildcard *.dev.check-consulting.net, certificat par défaut de Traefik (cert-manager).
server:
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.dev.check-consulting.net
    path: /
    pathType: Prefix
    tls: false
