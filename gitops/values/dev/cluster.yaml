# Source de vérité de l'environnement dev.
# Lu par bootstrap/bootstrap.sh ET passé en values au chart racine gitops/
# par l'Application racine : une version ne se change QU'ICI.
cluster:
  env: dev
  name: eks-team-eks-business-analyst-formation-dev
  region: eu-west-3

# Chart racine et values des outils (dossier gitops/ de ce dépôt)
gitops:
  repoURL: https://github.com/mchekini-check-consulting/formation-ba-gitops.git
  targetRevision: main
  path: gitops

crdBase:
  repoURL: https://github.com/mchekini-check-consulting/formation-ba-gitops.git
  targetRevision: main
  path: crd-base

chartBase:
  repoURL: https://github.com/mchekini-check-consulting/formation-ba-gitops.git
  targetRevision: main
  path: chart-base

# Projets métier (environnements, projets) : bloc business de gitops/values.yaml

# version = version du chart Helm
#         = dossiers crd-base/<outil>/<version> et chart-base/<outil>/<version>
tools:
  argocd:
    version: 10.9.6
  traefik:
    version: 41.6.1
  external-dns:
    version: 1.23.0
  cert-manager:
    version: v1.21.2
  falco:
    version: 9.2.0
  cloudnative-pg:
    version: 0.29.1
  plugin-barman-cloud:
    version: 0.8.1     # plugin v0.15.1
  sonarqube-db:
    version: 0.2.0     # chart pg-cluster
  sonarqube:
    version: 2026.5.1002
  sonarqube-config:
    version: 0.1.0     # chart maison chart-base/sonarqube-config
  cloudbeaver-db:
    version: 0.2.0     # chart pg-cluster
  cloudbeaver:
    version: 0.1.0     # chart maison chart-base/cloudbeaver
  kargo:
    version: 1.12.4
  keycloak-db:
    version: 0.2.0     # chart pg-cluster
  # keycloak et keycloak-config se montent ensemble : le tag de keycloak-config-cli
  # (chart-base/keycloak-config) suit la version de Keycloak (26.5.5 ici)
  keycloak:
    version: 7.1.9     # chart keycloakx, Keycloak 26.5.5
  keycloak-config:
    version: 0.3.1     # chart maison chart-base/keycloak-config
