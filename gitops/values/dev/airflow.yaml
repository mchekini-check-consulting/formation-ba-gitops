# Ingress servi par Traefik ; external-dns cree l'alias -> NLB.
# HTTPS : wildcard *.dev.check-consulting.net, certificat par defaut de Traefik (cert-manager).
ingress:
  host: airflow-juba.dev.check-consulting.net

# Secret cree a la main dans le namespace (jamais dans Git) :
#   kubectl -n airflow create secret generic airflow-fernet-key \
#     --from-literal=fernet-key=<cle generee avec Fernet.generate_key()>
fernetKeySecret:
  name: airflow-fernet-key
