{{- /* Une Application crds-<outil> par outil activé (sauf crds: false), wave -10 :
       les CRDs existent avant les charts (installés avec skipCrds).
       Pas de prune : supprimer une CRD supprime toutes ses ressources. */}}
{{- range $name, $t := .Values.tools }}
{{- if and $t.enabled (ne $t.crds false) }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crds-{{ $name }}
  namespace: {{ $.Values.argocdNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $.Values.crdBase.syncWave | quote }}
spec:
  project: {{ $.Values.project }}
  source:
    repoURL: {{ required "crdBase.repoURL requis" $.Values.crdBase.repoURL }}
    targetRevision: {{ $.Values.crdBase.targetRevision }}
    path: {{ $.Values.crdBase.path }}/{{ $name }}/{{ required (printf "tools.%s.version requis" $name) $t.version }}
  destination:
    server: {{ $.Values.destinationServer }}
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
{{- end }}
{{- end }}
